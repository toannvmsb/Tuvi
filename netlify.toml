# Cấu hình deploy bản WEB lên Netlify (Expo Web export).
#
# - command: build static SPA ra thư mục dist/
# - publish: thư mục Netlify sẽ serve
# - redirect /* → /index.html (SPA fallback): để khi user refresh trang hoặc mở
#   deep link (vd tuzi.vn/xem-ngay-tot) không bị lỗi 404 — React Navigation
#   xử lý route phía client.

[build]
  command = "npx expo export --platform web"
  publish = "dist"

# SPA fallback — mọi đường dẫn chưa khớp file tĩnh → trả index.html (HTTP 200).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# (Tùy chọn) ép HTTPS + vài header bảo mật cơ bản.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Path /embed — dùng cho Partner SSO (nhúng Tuzi vào app đối tác qua iframe/WebView, xem
# CLAUDE.md mục "Partner SSO"). Netlify áp header theo path KHỚP CỤ THỂ NHẤT nên path này
# KHÔNG kế thừa X-Frame-Options: SAMEORIGIN ở trên — thay bằng CSP frame-ancestors riêng.
# Mặc định chỉ 'self' → CHƯA đối tác nào nhúng được cho tới khi thêm domain của họ vào đây.
[[headers]]
  for = "/embed"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self'"
    # Khi có đối tác thật, thêm domain của họ vào đây rồi deploy lại, vd:
    # Content-Security-Policy = "frame-ancestors 'self' https://app.doi-tac.vn"
