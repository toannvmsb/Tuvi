# Cấu hình deploy bản WEB lên Netlify (Expo Web export).
#
# - command: build static SPA ra thư mục dist/
# - publish: thư mục Netlify sẽ serve
# - redirect /* → /index.html (SPA fallback): để khi user refresh trang hoặc mở
#   deep link (vd tuzi.vn/xem-ngay-tot) không bị lỗi 404 — React Navigation
#   xử lý route phía client.

[build]
  command = "npx expo export --platform web"
  publish = "dist"

# SPA fallback — mọi đường dẫn chưa khớp file tĩnh → trả index.html (HTTP 200).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# (Tùy chọn) ép HTTPS + vài header bảo mật cơ bản.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
